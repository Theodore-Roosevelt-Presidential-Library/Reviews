name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Called by the collect workflow. A push made with GITHUB_TOKEN does not trigger
  # workflows — GitHub blocks that to prevent recursive runs — so the daily data commit
  # would never fire the push trigger above. Without this, the dashboard silently freezes
  # at whatever a human last pushed.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Never publish data the dashboard cannot parse.
      - name: Validate data
        run: python3 collector/validate.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # The dashboard reads its data from a path relative to itself.
          mkdir -p _site/data
          cp -r data/derived _site/data/
          cp data/reviews.json _site/data/
          cp CNAME _site/CNAME
          # Nothing here should be indexed — it's an internal tool on a public host.
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
