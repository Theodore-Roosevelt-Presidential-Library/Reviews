name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/* _site/
          # The dashboard reads its data from a path relative to itself.
          mkdir -p _site/data
          cp -r data/derived _site/data/
          cp data/reviews.json _site/data/
          cp CNAME _site/CNAME
          # Nothing here should be indexed — it's an internal tool on a public host.
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
