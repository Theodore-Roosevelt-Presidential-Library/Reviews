name: Deploy dashboard

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/**"
      - "CNAME"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  # Called by the collect workflow. A push made with GITHUB_TOKEN does not trigger
  # workflows — GitHub blocks that to prevent recursive runs — so the daily data commit
  # would never fire the push trigger above. Without this, the dashboard silently freezes
  # at whatever a human last pushed.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, but never cancel one that is already running — a half-finished
# Pages deployment is how you end up serving a partial site. Queued runs are superseded;
# in-flight ones are allowed to finish. This matches GitHub's own Pages template.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Never publish data the dashboard cannot parse.
      - name: Validate data
        run: python3 collector/validate.py

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          # The dashboard reads its data from a path relative to itself.
          mkdir -p _site/data
          cp -r data/derived _site/data/
          cp data/reviews.json _site/data/
          cp CNAME _site/CNAME
          # Nothing here should be indexed — it's an internal tool on a public host.
          printf 'User-agent: *\nDisallow: /\n' > _site/robots.txt

      - uses: actions/configure-pages@v5

      # Artifacts belong to the workflow *run*, not the attempt. Re-running just the
      # deploy job therefore leaves the previous attempt's artifact in place and
      # deploy-pages fails with "Multiple artifacts named github-pages were unexpectedly
      # found". Naming it per attempt makes a re-run produce a fresh, unambiguous artifact.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      # v5 runs on node24; v4 runs on node20, which GitHub is deprecating.
      - id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
