name: Collect reviews

on:
  schedule:
    # 11:00 UTC = 6:00 AM Central. Runs before the team's day starts.
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "Ignore stored dates and re-pull every review"
        type: boolean
        default: false

permissions:
  contents: write
  models: read

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      # Without this, stdout is block-buffered in Actions and stderr is not, so error
      # lines surface before the context that explains them.
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Someone may have pushed since this job was queued. Rebase first so the push at
      # the end can't be rejected, and so we never hand-merge generated files.
      - name: Sync with main
        run: |
          git config user.name  "trpl-reviews-bot"
          git config user.email "actions@github.com"
          git pull --rebase --autostash origin main

      - name: Collect from sources
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python3 collector/collect.py ${{ inputs.full && '--full' || '' }}

      # Fail fast if the provider is gone or the model was renamed. This step is the
      # reason a retired endpoint can't quietly turn the pipeline back into regex.
      - name: Preflight the model provider
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 collector/analyze.py --check

      - name: Classify and summarise
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 collector/analyze.py

      # Always regenerate derived files after a rebase. They are a pure function of
      # reviews.json, so this resolves any conflict in them without a manual merge.
      - name: Build derived metrics
        run: python3 collector/derive.py

      - name: Validate data
        run: python3 collector/validate.py

      - name: Commit changes
        run: |
          git add data/
          if git diff --staged --quiet; then
            echo "No change in review data."
          else
            NEW=$(python3 -c "import json;print(len(json.load(open('data/reviews.json'))['reviews']))")
            git commit -m "Reviews refresh $(date -u +%Y-%m-%d) — ${NEW} tracked"
            git push || (git pull --rebase origin main && python3 collector/derive.py \
                         && git add data/ && git commit --amend --no-edit && git push)
          fi

  # A push made with GITHUB_TOKEN does not trigger other workflows, so the deploy has to
  # be called explicitly. Runs even if collection found nothing new, which is what
  # recovers the site if a previous deploy published broken data.
  deploy:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write
